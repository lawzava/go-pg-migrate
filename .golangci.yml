version: "2"
linters:
  default: all
  disable:
    - depguard
    - exhaustruct # Replaced by exhaustruct_v5.
    - gomodguard # Replaced by gomodguard_v2.
    - noinlineerr # Keep the existing inline error handling convention.
    - wsl # Replaced by wsl_v5.
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    misspell:
      locale: US
    nakedret:
      max-func-lines: 2
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gochecknoglobals
          - gochecknoinits # Examples register migrations during initialization.
          - mnd
          - varnamelen
        path: examples/*
      - linters:
          - exhaustruct_v5
          - goconst
          - paralleltest # Tests use the global migration registry and default logger.
        path: _test\.go
    paths:
      - third_party$
      - builtin$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/lawzava/go-pg-migrate/v2
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
