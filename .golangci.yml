version: "2"
run:
  # Paths in exclusions are relative to this file, so the nested integration
  # module can be linted with `--config ../.golangci.yml`.
  relative-path-mode: cfg
linters:
  default: all
  disable:
    - depguard
    - exhaustruct # Replaced by exhaustruct_v5.
    - gomodguard # Replaced by gomodguard_v2.
    - noinlineerr # Keep the existing inline error handling convention.
    - testpackage # Tests exercise unexported planning and ledger code.
    - wsl # Replaced by wsl_v5.
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gomoddirectives:
      replace-local: true # integration/go.mod tests the working tree.
    misspell:
      locale: US
    nakedret:
      max-func-lines: 2
    tagliatelle:
      case:
        rules:
          json: snake
    varnamelen:
      ignore-names: [db, tx, fn, i, m, tb, tt, wg]
    wrapcheck:
      # Callers wrap migration errors with version and name.
      ignore-interface-regexps: ['^Executor$']
      ignore-package-globs: ['github.com/lawzava/go-pg-migrate/v3*']
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - cyclop # Scenario tests check several states in sequence.
          - exhaustruct_v5
          - funlen # Same reason as cyclop.
          - goconst
          - lll # Table-driven cases read best one per line.
          - mnd
          - thelper # eachDriver callbacks are test bodies, not helpers.
        path: _test\.go
      - linters:
          - err113 # The example CLI reports usage errors directly.
          - exhaustruct_v5 # Examples show the zero-value Config and optional fields as users write them.
          - gochecknoglobals # Migration lists and driver lists are package data.
          - mnd # Migration versions are literal numbers.
        path: integration/
    paths:
      - third_party$
      - builtin$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/lawzava/go-pg-migrate/v3
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
